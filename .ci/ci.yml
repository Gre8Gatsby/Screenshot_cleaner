name: Android & Rust Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-rust:
    name: Rust Core Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-core -> rust-core/target"

      - name: Run Rust unit & integration tests
        run: |
          cd rust-core
          cargo test --verbose

      - name: Check size-optimized release build
        run: |
          cd rust-core
          cargo build --release

  build-android:
    name: Build Android App (Release APK & AAB)
    needs: test-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install Rust & cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk

      - name: Compile Rust core for Android ABIs
        run: |
          cd rust-core
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK and App Bundle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify APK Size
        run: |
          echo "=== Release APK size report ==="
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-autoexpirer-release-apk
          path: app/build/outputs/apk/release/*.apk

